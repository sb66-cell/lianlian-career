<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星途职引 · 发现你的职业新可能</title>

<script>
(function(){
  var c=document.getElementById("starfieldCanvas");if(!c)return;
  var ctx=c.getContext("2d"),stars=[],STARS=250,mx=0,my=0,tmx=0,tmy=0;
  function rs(){c.width=window.innerWidth;c.height=window.innerHeight;}
  window.addEventListener("resize",rs);
  document.addEventListener("mousemove",function(e){tmx=(e.clientX/window.innerWidth-0.5)*2;tmy=(e.clientY/window.innerHeight-0.5)*2});
  document.addEventListener("touchmove",function(e){var t=e.touches[0];tmx=(t.clientX/window.innerWidth-0.5)*2;tmy=(t.clientY/window.innerHeight-0.5)*2},{passive:true});
  rs();
  for(var i=0;i<STARS;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*100+1,r:Math.random()*2+0.5,b:Math.random()*0.5+0.5,ts:Math.random()*0.02+0.005});
  (function A(){requestAnimationFrame(A);
    mx+=(tmx-mx)*0.03;my+=(tmy-my)*0.03;ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){
      var s=stars[i],p=(101-s.z)/100,sx=s.x+mx*30*p,sy=s.y+my*30*p;
      if(sx<-10)sx+=c.width+20;if(sx>c.width+10)sx-=c.width+20;
      if(sy<-10)sy+=c.height+20;if(sy>c.height+10)sy-=c.height+20;
      var a=Math.max(0.15,Math.min(1,s.b+Math.sin(Date.now()*s.ts+i)*0.2));
      var sz=s.r*(s.z/60);
      ctx.beginPath();ctx.arc(sx,sy,sz,0,Math.PI*2);ctx.fillStyle="rgba(200,220,255,"+a+")";ctx.fill();
      if(sz>1.2){ctx.beginPath();ctx.arc(sx,sy,sz*2.5,0,Math.PI*2);ctx.fillStyle="rgba(180,200,255,"+(a*0.3)+")";ctx.fill();}
    }
  })();
})();
</script>

<style>
/* ============================================================
   CSS DESIGN SYSTEM — 求职宇宙 · Career Universe
   深邃、专业、冷静、值得信赖的职场风格
   ============================================================ */

/* --- CSS Custom Properties --- */
:root {
  /* Primary palette — 专业蓝紫色系 */
  --color-primary: #4F46E5;
  --color-primary-hover: #4338CA;
  --color-primary-light: #EEF2FF;
  --color-primary-glow: rgba(79,70,229,0.1);

  /* Secondary accents */
  --color-cyan: #0891B2;
  --color-cyan-light: #ECFEFF;
  --color-teal: #0D9488;
  --color-teal-light: #F0FDFA;
  --color-violet: #7C3AED;
  --color-violet-light: #F5F3FF;
  --color-amber: #D97706;
  --color-amber-light: #FFFBEB;

  /* Surfaces & Backgrounds — 清爽浅色 */
  --color-bg: #F8FAFC;
  --color-bg-alt: #F1F5F9;
  --color-card: #FFFFFF;
  --color-card-hover: #F8FAFC;
  --color-border: #E8ECF0;
  --color-border-active: #4F46E5;

  /* Text hierarchy — 高对比度 dark on light */
  --color-text: #0F172A;
  --color-text-secondary: #475569;
  --color-text-muted: #94A3B8;
  --color-text-on-primary: #FFFFFF;

  /* Shadows — 干净专业 */
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-card: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-card-hover: 0 2px 8px rgba(15,23,42,0.06);
  --shadow-button: 0 2px 8px rgba(79,70,229,0.25);
  --shadow-lg: 0 10px 40px rgba(15,23,42,0.08);

  /* Border radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 999px;

  /* Transitions — professional smooth, no bounce */
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.15s;
  --transition-normal: 0.25s;
  --transition-slow: 0.4s;
}

/* --- Reset & Base --- */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, sans-serif;
  background: #F8FAFC;
  color: var(--color-text);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.app-container {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

/* --- Header / Nav --- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: 12px 20px;
  border-bottom: 1px solid rgba(15,23,42,0.06);
  transition: padding 0.3s var(--ease-smooth);
}
.app-header.quiz-mode {
  padding: 6px 20px;
}
.app-header.quiz-mode .header-inner { display: none; }
.app-header.quiz-mode .stepped-progress { display: none; }
.app-header.quiz-mode #progressMascot { display: none; }
.app-header.quiz-mode #progressBarArea { margin-top: 0 !important; }

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 680px;
  margin: 0 auto;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Quicksand', 'PingFang SC', sans-serif;
  font-weight: 700;
  font-size: 1.25rem;
  color: var(--color-primary);
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #4F46E5, #6366F1);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  box-shadow: 0 0 20px rgba(99,102,241,0.3);
}

/* --- Phase Indicator --- */
.phase-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
}
.phase-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #E2E8F0;
  transition: all var(--transition-normal) var(--ease-smooth);
}
.phase-dot.active {
  background: var(--color-primary);
  box-shadow: 0 0 8px rgba(79,70,229,0.3);
  transform: scale(1.3);
}
.phase-dot.done {
  background: var(--color-teal);
}
.phase-line {
  width: 20px; height: 2px;
  background: #E2E8F0;
  border-radius: 1px;
}
.phase-line.done {
  background: var(--color-teal);
}

/* --- Main Content --- */
.main-content {
  flex: 1;
  padding: 24px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* --- Cards --- */
.card {
  background: var(--color-card);
  border-radius: var(--radius-xl);
  padding: 24px;
  box-shadow: var(--shadow-card);
  transition: all var(--transition-normal) var(--ease-smooth);
  animation: cardSlideUp 0.35s var(--ease-smooth);
  border: 1px solid var(--color-border);
}
.card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-card-hover);
  border-color: rgba(129,140,248,0.3);
}
.card.color-top {
  border-top: 3px solid var(--color-border);
  padding-top: 20px;
}
.card.color-top.yellow { border-top-color: var(--color-primary); }

@keyframes cardSlideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes cardPopIn {
  0% { opacity: 0; transform: scale(0.8); }
  70% { transform: scale(1.04); }
  100% { opacity: 1; transform: scale(1); }
}
.card-pop { animation: cardPopIn 0.35s var(--ease-smooth); }

/* --- Chat Bubbles --- */
.chat-bubble {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  animation: cardSlideUp 0.3s var(--ease-smooth);
}
.chat-bubble.coach { justify-content: flex-start; }
.chat-bubble.user { justify-content: flex-end; }

.bubble-avatar {

}
.coach .bubble-avatar {

}
.user .bubble-avatar {

}

.bubble-content {

.coach .bubble-content {

.user .bubble-content {

/* --- Question Card --- */
.question-card {

  border-radius: var(--radius-xl);
  padding: 28px 24px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(44,62,80,0.04);
  animation: cardSlideUp 0.35s var(--ease-smooth);
}
.question-number {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  background: var(--color-primary-light);
  color: var(--color-primary);
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 12px;
}
.question-text {
  font-size: 1.15rem;
  font-weight: 600;
  margin-bottom: 20px;
  color: var(--color-text);
  line-height: 1.5;
}

/* --- Option Cards (big clickable) --- */
.option-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.option-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border: 2px solid #EDE8E0;
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all var(--transition-fast) var(--ease-smooth);
  background: var(--color-card);
  font-size: 0.95rem;
}
.option-card:hover {
  border-color: var(--color-primary);
  background: #FFF5F0;
  transform: scale(1.02);
}
.option-card.selected {
  border-color: var(--color-primary);
  background: var(--color-primary-light);
  box-shadow: 0 0 0 3px rgba(255,107,107,0.12);
  animation: optionSelect 0.3s var(--ease-smooth);
}
@keyframes optionSelect {
  0% { transform: scale(1); }
  40% { transform: scale(0.96); }
  100% { transform: scale(1); }
}
.option-card .option-icon {
  font-size: 1.5rem;
  flex-shrink: 0;
}
.option-card .check-mark {
  margin-left: auto;
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid #D0C8C0;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition-fast) var(--ease-smooth);
  font-size: 0.7rem;
  color: transparent;
}
.option-card.selected .check-mark {
  background: var(--color-teal);
  border-color: var(--color-teal);
  color: white;
}

/* Multi-select option (tag style for values question) */
.tag-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-option {
  padding: 10px 18px;
  border: 2px solid #EDE8E0;
  border-radius: var(--radius-full);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all var(--transition-fast) var(--ease-smooth);
  background: var(--color-card);
  user-select: none;
}
.tag-option:hover {
  border-color: var(--color-violet);
  background: var(--color-violet-light);
}
.tag-option.selected {
  background: var(--color-violet);
  color: white;
  border-color: var(--color-violet);
  box-shadow: 0 2px 8px rgba(155,89,182,0.3);
}
.tag-option.tag-rec {
  border-color: var(--color-primary);
  background: #FFFBF0;
  border-style: dashed;
}
.tag-option.tag-rec:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-light);
}

/* --- Text Input --- */
.text-input-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.text-input {
  width: 100%;
  padding: 14px 18px;
  border: 2px solid #EDE8E0;
  border-radius: var(--radius-md);

  resize: vertical;

.text-input:focus {

.btn {

  font-size: 0.95rem;

  text-decoration: none;

}
.btn:hover { transform: scale(1.05); }
.btn:active { transform: scale(0.95); }

.btn-primary {
  background: linear-gradient(135deg, #4F46E5, #6366F1);

}
.btn-primary:hover {

}
.btn-outline {

}
.btn-outline:hover {

}
.btn-ghost {
  background: transparent;
  color: var(--color-text-secondary);
}
.btn-ghost:hover {

}
.btn-small {
  padding: 8px 18px;
  font-size: 0.85rem;
}

/* --- Progress Bar --- */
.progress-bar-wrapper {

  border-radius: var(--radius-full);
  overflow: hidden;
}
.progress-bar-fill {

  background-size: 200% 100%;

  transition: width 0.35s var(--ease-smooth);
}
@keyframes progressShimmer {

  100% { background-position: -100% 0; }
}

/* --- Flash Card (Phase 1 result) --- */
.flash-card {
  background: linear-gradient(135deg, #FFFFFF, #F5F7FF);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: 28px 24px;
  box-shadow: var(--shadow-lg);
  animation: cardPopIn 0.3s var(--ease-smooth);
  position: relative;
  overflow: hidden;
}
.flash-card::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(79,70,229,0.08), transparent);
  border-radius: 50%;
}
.flash-card h3 {
  color: var(--color-primary);
  margin-bottom: 16px;
  font-size: 1.3rem;
}
.flash-section {
  margin-bottom: 12px;
  padding-left: 8px;
}
.flash-section .label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.flash-section .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.flash-tag {
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 500;
}
.flash-tag.ability { background: #DCFCE7; color: #166534; }
.flash-tag.passion { background: #E0F2FE; color: #075985; }
.flash-tag.style { background: #E0F2FE; color: #0F766E; }
.flash-tag.drive { background: #F3E8FF; color: #6B21A8; }

/* --- Venn Diagram (Phase 2) --- */
.venn-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 8px 0;
}
.venn-svg {
  width: 100%;
  max-width: 420px;
  height: auto;
}
.venn-circle {
  transition: all 0.3s var(--ease-smooth);
}

/* Ratio Sliders */
.ratio-slider-group {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
}
.ratio-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.ratio-label {
  width: 100px;
  font-weight: 700;
  font-size: 0.85rem;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.ratio-slider {
  flex: 1;
  -webkit-appearance: none;
  height: 8px;
  border-radius: var(--radius-full);
  background: #EDE8E0;
  outline: none;
}
.ratio-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px; height: 26px;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: transform 0.2s var(--ease-smooth);
}
.ratio-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
.ratio-slider.want::-webkit-slider-thumb { background: var(--color-teal); }
.ratio-slider.good::-webkit-slider-thumb { background: var(--color-teal); }
.ratio-slider.money::-webkit-slider-thumb { background: var(--color-primary); }
.ratio-value {
  width: 44px;
  text-align: center;
  font-weight: 700;
  font-size: 0.9rem;
}

/* Preset cards */
.preset-group {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}
.preset-card {
  padding: 16px;
  border-radius: var(--radius-lg);
  border: 2px solid #EDE8E0;
  cursor: pointer;
  transition: all var(--transition-fast) var(--ease-smooth);
  text-align: center;
  background: var(--color-card);
}
.preset-card:hover {
  border-color: var(--color-violet);
  transform: translateY(-2px);
  box-shadow: var(--shadow-card);
}
.preset-card.selected {
  border-color: var(--color-violet);
  background: var(--color-violet-light);
  box-shadow: 0 0 0 3px rgba(155,89,182,0.12);
}
.preset-name {
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 4px;
}
.preset-ratio {
  font-size: 0.85rem;
  color: var(--color-text-secondary);
}

/* --- Job Connect Card (Phase 3) --- */
.job-card {
  background: var(--color-card);
  border-radius: var(--radius-xl);
  padding: 24px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(44,62,80,0.05);
  animation: cardSlideUp 0.35s var(--ease-smooth);
  position: relative;
  overflow: hidden;
}
.job-card .connect-line {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  font-size: 0.85rem;
  color: var(--color-text-secondary);
}
.connect-line .ability-tag {
  background: var(--color-blue-light);
  color: #2E7D32;
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-weight: 600;
}
.connect-line .arrow {
  color: var(--color-primary);
  font-weight: 700;
  animation: arrowPulse 1s infinite;
}
@keyframes arrowPulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 0.3; }
}
.connect-line .job-name {
  background: var(--color-primary-light);
  color: var(--color-primary);
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-weight: 700;
}

/* Job card sections */
.job-section {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #F0EBE0;
}
.job-section-title {
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--color-text-secondary);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Tag system for job cards */
.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}
.tag-pill {
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-size: 0.8rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.tag-trend { background: #FEE2E2; color: #991B1B; }
.tag-city { background: #E0F2FE; color: #075985; }
.tag-special { background: #F3E8FF; color: #6B21A8; }
.tag-beginner { background: #DCFCE7; color: #166534; }
.tag-skill { background: #FEF9C3; color: #A16207; }
.tag-mode { background: #F3E8FF; color: #6B21A8; }
.tag-warning { background: #FEE2E2; color: #991B1B; }

/* Star rating */
.star-rating {
  display: inline-flex;
  gap: 2px;
  font-size: 1.1rem;
}
.star-rating .star-filled { color: var(--color-primary); }
.star-rating .star-empty { color: #E2E8F0; }

/* --- Timeline (14-day plan) --- */
.timeline {
  position: relative;
  padding-left: 28px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 10px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  background: linear-gradient(to bottom, var(--color-primary), var(--color-teal));
  border-radius: 2px;
}
.timeline-item {
  position: relative;
  margin-bottom: 20px;
  padding-left: 12px;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -22px;
  top: 6px;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 3px solid var(--color-primary);
  background: white;
  transition: all var(--transition-fast) var(--ease-smooth);
}
.timeline-item.done::before {
  background: var(--color-teal);
  border-color: var(--color-teal);
}
.timeline-period {
  font-weight: 700;
  color: var(--color-primary);
  font-size: 0.85rem;
  margin-bottom: 2px;
}

/* --- Comparison Table --- */
.compare-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.85rem;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.compare-table th {
  background: #FFF5F0;
  padding: 10px 12px;
  text-align: left;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--color-text-secondary);
}
.compare-table td {
  padding: 10px 12px;
  border-top: 1px solid #F0EBE0;
  background: white;
}
.compare-table tr:hover td {
  background: #FFFBF5;
}

// ============ DOM REFS ============
const mainContent = document.getElementById('mainContent');
const globalProgress = document.getElementById('globalProgress');
const phaseIndicator = document.getElementById('phaseIndicator');

// ============ RENDER ENGINE ============
function render() {
  switch (state.phase) {
    case 'welcome': renderWelcome(); break;
    case 'phase1': renderPhase1Question(); break;
    case 'phase1_flash': renderFlashCard(); break;
    case 'phase2': renderPhase2(); break;
    case 'phase2_result': renderPhase2Result(); break;
    case 'phase3': renderPhase3(); break;
    case 'final': renderFinal(); break;
  }
  updateProgress();
  saveProgress();

  // Collapse header + hide canvas during Phase 1 for focused experience
  var header = document.getElementById('appHeader');
  if (header) {
    if (state.phase === 'phase1') { header.classList.add('quiz-mode'); }
    else { header.classList.remove('quiz-mode'); }
  }
  var c = document.getElementById('starfieldCanvas');
  if (c) c.style.display = (state.phase === 'welcome') ? 'block' : 'none';

  // Smooth scroll to latest content
  setTimeout(() => {
    mainContent.scrollTop = mainContent.scrollHeight;
    if (mainContent.lastElementChild) {
      mainContent.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
  }, 100);
}

function updateProgress() {
  var pct = 0, activeStep = 1;
  if (state.phase === 'phase1') { pct = (state.questionIndex / 10) * 20; activeStep = 1; }
  else if (state.phase === 'phase1_flash') { pct = 20; activeStep = 1; }
  else if (state.phase === 'phase2') {
    if (state.phase2Step === 'tree') { pct = 22; activeStep = 2; }
else if (state.phase2Step === 'ratio') { pct = 44; activeStep = 3; }
  } else if (state.phase === 'phase2_result') { pct = 50; activeStep = 3; }
  else if (state.phase === 'phase3') {
    if (state.phase3Step === 'intro') pct = 55;
    else if (state.phase3Step === 'cards') pct = 72;
    else if (state.phase3Step === 'table') pct = 85;
    else if (state.phase3Step === 'timeline') pct = 95;
    activeStep = 4;
  } else if (state.phase === 'final') { pct = 100; activeStep = 4; }
  globalProgress.style.width = pct + '%';
  // Update mascot + percentage
  var mascot = document.getElementById('progressMascot');
  var pctEl = document.getElementById('progressPct');
  if (mascot) { mascot.style.left = Math.min(pct, 95) + '%'; }
  if (pctEl) { pctEl.textContent = pct + '%'; }
  // Change mascot based on phase

  if (mascot) {
    if (pct >= 100) mascot.textContent = '🎊';
    else if (pct >= 50) mascot.textContent = '🔗';
    else if (pct >= 25) mascot.textContent = '⚗️';
    else mascot.textContent = '⭐';
  }

  // Update stepped progress
  var nodes = document.querySelectorAll('.step-node');
  var conns = document.querySelectorAll('.step-connector');
  for (var i = 0; i < nodes.length; i++) {
    var n = i + 1, dot = nodes[i].querySelector('.step-dot'), lbl = nodes[i].querySelector('.step-label');
    dot.classList.remove('active','done'); lbl.classList.remove('active','done');
    if (n < activeStep) { dot.classList.add('done'); lbl.classList.add('done'); dot.textContent = '✓'; }
    else if (n === activeStep) { dot.classList.add('active'); lbl.classList.add('active'); dot.textContent = n; }
    else { dot.textContent = n; }
  }
  for (var j = 0; j < conns.length; j++) {
    conns[j].classList.remove('active','done');
    if (j + 1 < activeStep) conns[j].classList.add('done');
    else if (j + 1 === activeStep) conns[j].classList.add('active');
  }
}

  state.questionIndex = 0;
  state._answerHistory = [];

}

// ============ PHASE 1: FLASH POINT DISCOVERY ============
function renderPhase1Question() {
  const q = PHASE1_QUESTIONS[state.questionIndex];
  if (!q) { finishPhase1(); return; }

  let inputHTML = '';
  switch (q.type) {
    case 'singleChoice':
      // Click an option → auto-submit (no extra button needed)
      inputHTML = '<div class="option-group">' +
        q.options.map(function(o) {
          return '<div class="option-card" data-id="' + o.id + '" onclick="submitSingleChoice(\'' + q.id + '\',\'' + o.id + '\')"><span class="option-icon">' + o.icon + '</span><div><strong>' + o.label + '</strong><div class="text-secondary">' + o.desc + '</div></div><div class="check-mark">✓</div></div>';
        }).join('') +
        '</div>';
      break;

    case 'multiPick2':
      // Max 2 selections with counter
      state._multiTemp = [];
      inputHTML = '<div class="option-group" id="multiOptions">' +
        q.options.map(function(o) {
          return '<div class="option-card" data-id="' + o.id + '" onclick="toggleMultiPick(\'' + q.id + '\',\'' + o.id + '\',' + q.maxSelect + ')"><span class="option-icon">' + o.icon + '</span><div><strong>' + o.label + '</strong><div class="text-secondary">' + o.desc + '</div></div><div class="check-mark">✓</div></div>';
        }).join('') +
        '</div>' +
        '<div class="text-secondary mt-8" id="pickHint">已选 0 / ' + q.maxSelect + ' 个</div>' +
        '<button class="btn btn-primary mt-12" onclick="submitMultiPick(\'' + q.id + '\',' + q.maxSelect + ')" disabled id="multiPickSubmit">确认提交</button>';
      break;

    case 'backgroundForm':
      inputHTML = '<div class="text-input-group">' +
        '<input class="text-input text-input-single" id="bgMajor" placeholder="专业 / 在读或毕业">' +
        '<input class="text-input text-input-single" id="bgWorkYears" placeholder="工作年限（如：应届 / 1年）">' +
        '<input class="text-input text-input-single" id="bgCurrentCity" placeholder="当前城市">' +
        '<input class="text-input text-input-single" id="bgTargetCity" placeholder="意向城市（可选）">' +
        '<button class="btn btn-primary" onclick="submitBackground()">确认提交</button>' +
        '</div>';
      break;
  }

  mainContent.innerHTML = '<div class="question-card">' +
    '<div class="question-number">' + q.emoji + ' 第 ' + q.number + ' / 10 题 · ' + (q.coinLabel || '金币') + '</div>' +
    '<div class="question-text">' + q.title + '</div>' +
    (q.subtitle ? '<p class="text-secondary mb-16">' + q.subtitle + '</p>' : '') +
    inputHTML +
    (state.questionIndex > 0 ? '<button class="btn btn-ghost btn-small mt-12" onclick="goBackQuestion()" style="font-size:0.85rem;">← 返回上一题</button>' : '') +
    '</div>';
}

// ---- Phase 1 Handlers ----
function submitSingleChoice(qid, value) {
  profile[qid] = value;

  // Highlight selected, disable others, show confirmation
  var cards = document.querySelectorAll('.option-card');
  cards.forEach(function(c) {
    c.style.pointerEvents = 'none';
    if (c.getAttribute('data-id') === value) {
      c.classList.add('selected');
    } else {
      c.style.opacity = '0.4';
    }
  });

  // Show brief confirmation
  var qcard = document.querySelector('.question-card');
  var confirm = document.createElement('div');
  confirm.style.cssText = 'text-align:center;margin-top:14px;padding:10px;background:var(--color-primary-light);border-radius:var(--radius-md);color:var(--color-primary);font-weight:600;font-size:0.9rem;animation:cardPopIn 0.3s var(--ease-smooth);';
  confirm.textContent = '✓ 已记录，即将进入下一题...';
  qcard.appendChild(confirm);

  // Auto-advance after brief pause
  setTimeout(function() {
    advanceQuestion();
  }, 700);
}

function toggleMultiPick(qid, value, max) {
  var el = event.target.closest('.option-card');
  if (!el) return;
  var idx = state._multiTemp.indexOf(value);
  if (idx >= 0) {
    state._multiTemp.splice(idx, 1);
    el.classList.remove('selected');
  } else {
    if (state._multiTemp.length >= max) return;
    state._multiTemp.push(value);
    el.classList.add('selected');
  }
  var hint = document.getElementById('pickHint');
  if (hint) hint.textContent = '已选 ' + state._multiTemp.length + ' / ' + max + ' 个';
  var btn = document.getElementById('multiPickSubmit');
  if (btn) btn.disabled = state._multiTemp.length === 0;
}

function submitMultiPick(qid, max) {
  profile[qid] = state._multiTemp.slice();
  advanceQuestion();
}

function submitBackground() {
  profile.major = document.getElementById('bgMajor').value.trim();
  profile.workYears = document.getElementById('bgWorkYears').value.trim();
  profile.currentCity = document.getElementById('bgCurrentCity').value.trim();
  profile.targetCity = document.getElementById('bgTargetCity').value.trim() || profile.currentCity;
  advanceQuestion();
}

function advanceQuestion() {
  // Save current answer for back-navigation
  if (!state._answerHistory) state._answerHistory = [];
  var q = PHASE1_QUESTIONS[state.questionIndex];
  var answer = null;
  if (q.type === 'singleChoice') answer = profile[q.id];
  else if (q.type === 'multiPick2') answer = profile[q.id] ? profile[q.id].slice() : null;
  state._answerHistory.push({qid: q.id, answer: answer});
  state.questionIndex++;
  if (state.questionIndex >= PHASE1_QUESTIONS.length) {
    finishPhase1();
  } else {
    render();
  }
}

function goBackQuestion() {
  if (!state._answerHistory || state._answerHistory.length === 0) return;
  var prev = state._answerHistory.pop();
  state.questionIndex--;
  // Restore previous answer
  if (prev.qid) profile[prev.qid] = prev.answer;
  render();
}

function finishPhase1() {
  // === MULTI-FRAMEWORK CROSS-ANALYSIS ===
  // Synthesize MBTI + Holland + Big Five into a unified personality report

  // --- 1. MBTI type string ---
  var mbtiType = (profile.mbti_ei || '?') + (profile.mbti_sn || '?') + (profile.mbti_tf || '?') + (profile.mbti_jp || '?');

  // --- 2. Holland code → ability + passion mapping ---
  var hollandMap = {
    'R': { ability: '动手操作', passion: '建造与制作', interest: '工具机械·户外实践' },
    'I': { ability: '分析思维', passion: '探索求知', interest: '研究分析·科学探索' },
    'A': { ability: '创意能力', passion: '创造与表达', interest: '艺术设计·创意表达' },
    'S': { ability: '共情沟通', passion: '助人成长', interest: '教育培训·社会服务' },
    'E': { ability: '组织管理', passion: '领导影响', interest: '商业经营·说服协调' },
    'C': { ability: '细致执行', passion: '有序建设', interest: '数据管理·流程优化' }
  };
  var hc = profile.hollandCode || [];
  var abilities = [];
  var passions = [];
  var interests = [];
  hc.forEach(function(c) {
    var m = hollandMap[c];
    if (m) {
      abilities.push(m.ability);
      passions.push(m.passion);
      interests.push(m.interest);
    }
  });

  // --- 3. Skills from Q8 → ability tags ---
  var skillMap = {
    'analytical': '分析逻辑', 'creative': '创意表达', 'interpersonal': '沟通共情',
    'technical': '技术动手', 'organizational': '组织统筹', 'resilience': '执行韧性'
  };
  (profile.dominantSkills || []).forEach(function(s) {
    if (skillMap[s]) abilities.push(skillMap[s]);
  });

  // --- 4. Values from Q7 → core drive + passion enrichment ---
  var valueMap = {
    'security': { drive: '安全与稳定', passion: '稳定深耕' },
    'achievement': { drive: '成就与卓越', passion: '专业精进' },
    'autonomy': { drive: '自主与自由', passion: '独立掌控' },
    'purpose': { drive: '意义与影响', passion: '社会价值' },
    'connection': { drive: '关系与归属', passion: '与人连接' },
    'growth': { drive: '成长与学习', passion: '持续突破' }
  };
  var coreDrive = '';
  (profile.coreValues || []).forEach(function(v) {
    var vm = valueMap[v];
    if (vm) {
      if (!coreDrive) coreDrive = vm.drive;
      passions.push(vm.passion);
    }
  });
  if (!coreDrive) coreDrive = '在适合自己的节奏中持续成长';

  // --- 5. Work style from MBTI E/I + J/P + environment ---
  var ei = profile.mbti_ei;
  var jp = profile.mbti_jp;
  var env = profile.workEnvPref;
  var workStyle = '';
  if (ei === 'I' && jp === 'J') workStyle = '独立深耕 + 有序推进';
  else if (ei === 'I' && jp === 'P') workStyle = '独立探索 + 灵活适应';
  else if (ei === 'E' && jp === 'J') workStyle = '团队协作 + 计划驱动';
  else if (ei === 'E' && jp === 'P') workStyle = '社交互动 + 即兴应变';
  else workStyle = '平衡协作 + 灵活节奏';

  // Environment enriches work style
  var envDesc = { 'structured': '规范有序', 'collaborative': '协作共生', 'autonomous': '自主灵活', 'fast-paced': '快节奏挑战', 'creative': '创意自由' };
  var envLabel = envDesc[env] || '灵活适应';

  // --- 6. Innovation tendency from openness ---
  var opennessMap = { 'low': '稳健务实型 — 偏好成熟方法和稳定环境', 'mid': '平衡开放型 — 稳定基础上适度尝新', 'high': '探索创新型 — 主动走出舒适区追求新挑战' };
  var innovationStyle = opennessMap[profile.openness] || '平衡开放型';

  // --- 7. Assemble final flash card ---
  var uniqueArr = function(arr) { var seen = {}; return arr.filter(function(x) { return seen[x] ? false : (seen[x] = true); }); };
  
  // --- NEW: Skills from Q4 (skillsSelfAssess) + Q5 (softSkills) -> ability tags ---
  var hardSkillMap = {data_analysis:"数据分析",writing_comm:"写作表达",coding_dev:"编程开发",design_creative:"创意设计",project_mgmt:"项目管理",biz_sales:"商务销售",people_mgmt:"人员管理",research_academic:"学术研究",language:"外语能力",mechanical_tech:"动手技术"};
  var softSkillMap = {communication:"沟通表达",critical_thinking:"批判思维",adaptability:"适应抗压",teamwork:"团队协作",self_mgmt:"自我管理",creativity:"创造力",empathy:"共情力",leadership:"领导力"};
  (profile.skillsSelfAssess||[]).forEach(function(s){if(hardSkillMap[s])abilities.push(hardSkillMap[s]);});
  (profile.softSkills||[]).forEach(function(s){if(softSkillMap[s])abilities.push(softSkillMap[s]);});
  var finalAbilities = uniqueArr(abilities).slice(0, 6);
  var finalPassions = uniqueArr(passions).slice(0, 5);
  var finalInterests = uniqueArr(interests).slice(0, 4);

  // Holland label
  var hollandLabel = hc.length > 0 ? hc.join('') + ' 型' : '多元型';
  var hollandNames = { 'R': '实做', 'I': '研究', 'A': '艺术', 'S': '社会', 'E': '企业', 'C': '常规' };
  var hollandDesc = hc.map(function(c) { return hollandNames[c] || c; }).join('+');

  profile.flashCard = {
    abilities: finalAbilities,
    passions: finalPassions,
    interests: finalInterests,
    workStyle: workStyle,
    coreDrive: coreDrive,
    envLabel: envLabel,
    innovationStyle: innovationStyle,
    mbtiType: mbtiType,
    hollandLabel: hollandLabel,
    hollandDesc: hollandDesc,
  };

  state.phase = 'phase1_flash';
  state.coins = 10;
  render();
  }

function toggleSubTag(el) {

function updateRatioSlider(fromPreset = false) {
  const w = parseInt(document.getElementById('sliderWant').value);
  const g = parseInt(document.getElementById('sliderGood').value);
  const m = parseInt(document.getElementById('sliderMoney').value);

  document.getElementById('valWant').textContent = w + '%';
  document.getElementById('valGood').textContent = g + '%';
  document.getElementById('valMoney').textContent = m + '%';

  const total = w + g + m;
  const warning = document.getElementById('ratioWarning');
  if (total !== 100) {
    warning.style.display = 'block';
  } else {
    warning.style.display = 'none';
  }

  // If user manually dragged (not from preset), clear preset selection
  if (!fromPreset) {
    profile.ratioPreset = '';
    document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('selected'));
  }

  // Update SVG circles
  const svg = document.getElementById('ratioPreview');
  if (svg) {
    const circles = svg.querySelectorAll('circle');
    circles[0].setAttribute('r', 30 + (w / 100) * 50);
    circles[1].setAttribute('r', 30 + (g / 100) * 50);
    circles[2].setAttribute('r', 30 + (m / 100) * 50);
    svg.querySelectorAll('text')[0].textContent = `💚 ${w}%`;
    svg.querySelectorAll('text')[1].textContent = `💙 ${g}%`;
    svg.querySelectorAll('text')[2].textContent = `💛 ${m}%`;
  }

  profile.ratioCustom = { want: w, good: g, money: m };
}

function selectPreset(id) {
  const preset = RATIO_PRESETS.find(p => p.id === id);
  profile.ratioPreset = id;
  profile.ratioCustom = { ...preset.ratio };

  document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.preset-card[data-preset="${id}"]`).classList.add('selected');

  document.getElementById('sliderWant').value = preset.ratio.want;
  document.getElementById('sliderGood').value = preset.ratio.good;
  document.getElementById('sliderMoney').value = preset.ratio.money;
  updateRatioSlider(true);
}

function matchCareers() {
  // Get user selected industry IDs for hard filter
  var selectedIndustryIds = (profile.selectedIndustries || []).map(function(s) { return s.cat; });
  var selectedSubNames = (profile.selectedIndustries || []).map(function(s) { return s.sub; });

  // HARD FILTER: only show careers in selected industries
  var candidates = CAREER_DB.filter(function(career) {
    if (selectedIndustryIds.length === 0) return true;
    var careerIndustry = CAREER_INDUSTRY_MAP[career.id];
    if (!careerIndustry) return true; // unknown industry = include
    return selectedIndustryIds.indexOf(careerIndustry) >= 0;
  });

  // Fallback: if no careers match, include all
  if (candidates.length === 0) candidates = CAREER_DB;

  var scored = candidates.map(function(career) {
    var score = 0;
    var matchReasons = [];

    // === ABILITY MATCH (weight: high) ===
    var userAbilities = (profile.flashCard && profile.flashCard.abilities) || [];
    var selfAssessed = profile.skillsSelfAssess || [];
    var softSkills = profile.softSkills || [];
    var allAbilities = userAbilities.concat(selfAssessed).concat(softSkills);
    var abilityHits = 0;
    career.matchAbilities.forEach(function(a) {
      var matched = allAbilities.some(function(ua) {
        if (typeof ua !== "string") return false;
        return a.indexOf(ua) >= 0 || ua.indexOf(a) >= 0;
      });
      if (matched) { score += 4; abilityHits++; }
    });
    if (abilityHits >= 3) matchReasons.push("能力高度匹配");
    else if (abilityHits >= 1) matchReasons.push("能力部分匹配");

    // === PERSONALITY TRAIT MATCH (from MBTI) ===
    var traitCareerMap = {
      "E": ["社交","沟通","表达","团队","领导","协作"],
      "I": ["独立","专注","深度","分析","研究","思考"],
      "S": ["务实","操作","细节","执行","数据","具体"],
      "N": ["创新","抽象","战略","概念","趋势","探索"],
      "T": ["逻辑","分析","理性","规则","系统","客观"],
      "F": ["共情","助人","关系","和谐","服务","价值"],
      "J": ["计划","组织","管理","流程","效率","有序"],
      "P": ["灵活","适应","创意","探索","变化","开放"]
    };
    var userTraits = [];
    if (profile.mbti_ei) userTraits.push(profile.mbti_ei);
    if (profile.mbti_sn) userTraits.push(profile.mbti_sn);
    if (profile.mbti_tf) userTraits.push(profile.mbti_tf);
    if (profile.mbti_jp) userTraits.push(profile.mbti_jp);
    var careerText = career.matchInterests.join(" ") + " " + career.matchValues.join(" ") + " " + career.name;
    userTraits.forEach(function(t) {
      var keywords = traitCareerMap[t] || [];
      keywords.forEach(function(kw) { if (careerText.indexOf(kw) >= 0) score += 1; });
    });

    // === VALUES MATCH ===
    var userCoreValues = profile.coreValues || [];
    var valueToCareerMap = {
      "security": ["稳定安全"],"achievement": ["经济回报","学习成长"],
      "autonomy": ["自主独立"],"purpose": ["社会价值"],
      "connection": ["人际关系"],"growth": ["学习成长","创造创新"]
    };
    userCoreValues.forEach(function(cv) {
      var mapped = valueToCareerMap[cv] || [];
      mapped.forEach(function(mv) {
        if (career.matchValues.indexOf(mv) >= 0) score += 3;
      });
    });

    // === INTEREST MATCH (from Holland) ===
    var userPassions = (profile.flashCard && profile.flashCard.passions) || [];
    var userInterests = (profile.flashCard && profile.flashCard.interests) || [];
    var allUserInterests = userPassions.concat(userInterests).join(" ");
    career.matchInterests.forEach(function(i) {
      if (allUserInterests.indexOf(i) >= 0) score += 2;
    });

    // === PROBLEM SOLVING STYLE BONUS ===
    if (profile.problemSolving) {
      var psMap = {
        "analytical": ["逻辑","分析","数据","系统","研究"],
        "collaborative": ["团队","协调","沟通","跨部门","协作"],
        "intuitive": ["创造","创新","设计","灵活","探索"],
        "structured": ["流程","规范","标准","质量","有序"]
      };
      var psKeywords = psMap[profile.problemSolving] || [];
      var careerFull = career.matchAbilities.join(" ") + " " + career.matchInterests.join(" ");
      psKeywords.forEach(function(kw) { if (careerFull.indexOf(kw) >= 0) score += 2; });
    }

    // === RATIO ALIGNMENT ===
    var r = profile.ratioCustom || {want:33,good:34,money:33};
    var highMoney = ["tech_sales","data_analyst","finance_analyst","consultant","semiconductor","crossborder_ecom","backend_dev","devops_sre","b_pm","actuary"];
    var highWant = ["content_creator","esg_analyst","ux_designer","psychologist","game_designer","brand_marketing","c_pm","frontend_dev","graphic_designer","journalist","architect"];
    var highGood = ["ai_product","data_analyst","consultant","new_energy_ve","bio_medical","backend_dev","growth_pm","tpm","accountant","medical_doctor","civil_engineer","electrical_eng"];
    if (r.money >= 45 && highMoney.indexOf(career.id) >= 0) score += Math.round(r.money / 15);
    if (r.want >= 40 && highWant.indexOf(career.id) >= 0) score += Math.round(r.want / 15);
    if (r.good >= 40 && highGood.indexOf(career.id) >= 0) score += Math.round(r.good / 15);

    return { ...career, score: score, matchReasons: matchReasons };
  });

  scored.sort(function(a, b) { return b.score - a.score; });
  profile.recommendedJobs = scored.slice(0, 6);
  profile._scored = scored;
}

function toggleProDetail(id, card) {

      toggleSpan = allSpans[i]; break;
    }
  }
  if (el.style.display === 'none' || !el.style.display) {
    el.style.display = 'block';
    if (toggleSpan) toggleSpan.textContent = '▲ 收起详情';
  } else {
    el.style.display = 'none';
    if (toggleSpan) toggleSpan.textContent = '▼ 展开详情';
  }
}

    {q:"UX设计师会被AI替代吗？",a:"<b>执行层画图工在被替代，但体验策略层反而更稀缺。</b>AI能生成UI稿但无法理解用户在场景中的情感需求。建议：1)学AI设计工具当效率利器；2)从画好看的界面升级到定义产品体验策略；3)扩展用户研究、服务设计等AI难替代领域。站酷热评：区分你价值的不是Figma用多好，而是能不能说出设计决策的why。"},
    {q:"没有美术基础能做UX吗？",a:"<b>可以，UX≠视觉设计。</b>UX核心是逻辑和信息架构。很多优秀UX设计师来自心理学、计算机等非艺术背景。你需要：用户研究能力+信息架构能力+基本视觉素养(可后天学)。Google UX证书完全面向零基础。但如果想做纯视觉设计(偏UI)，确实需要审美训练。"},
    {q:"UX在哪个行业发展最好？",a:"据脉脉/猎聘2024-25数据：<b>1)AI/大模型产品</b>(设计AI交互范式，稀缺+高薪)；<b>2)新能源汽车</b>(车机HMI/座舱体验，人才缺口大)；<b>3)出海SaaS</b>(国际化产品设计)；<b>4)金融科技</b>(复杂流程体验优化)。建议选复杂信息+高频交互特征的行业，最需UX系统性能力。"}

  content_creator: [
    {q:"做内容一定要露脸吗？社恐能做吗？",a:"<b>完全不需要！</b>不露脸形式：图文/信息图、音频/播客、AI数字人出镜、幕后型创作(剪辑/策划/编剧)。小红书有大量不露脸博主，B站有只出声不露脸的知识UP主。内容创作核心不是脸，而是你能不能持续提供有价值/有趣/有用的内容。"},
    {q:"内容运营薪资天花板在哪？怎么突破？",a:"三层：<b>1-3年执行型</b>(写稿/拍视频)10-18K；<b>3-5年策略型</b>(定策略/管团队/操盘IP)18-35K；<b>5年+商业型</b>(内容驱动增长/品牌总负责人或成IP)30-60K+。突破核心：从会做内容升级到会用内容解决商业问题。第2年就要关注ROI而不仅是阅读量。"},
    {q:"小红书/抖音/视频号/B站选哪个？",a:"<b>小红书</b>——最适合新手，图文门槛低；<b>抖音</b>——流量最大但竞争最激烈；<b>视频号</b>——微信生态增长快，适合私域+知识付费；<b>B站</b>——适合深度/长内容，粉丝粘性高但涨粉慢。建议先在小红书发10篇测试方向，根据数据再扩展。"}

  data_analyst: [
    {q:"数据分析师会被AI替代吗？",a:"<b>取数型在被替代，分析型/策略型反而更值钱。</b>AI能写SQL画图表但无法替代：1)定义什么问题值得分析(业务sense)；2)在模糊数据中发现异常pattern(好奇心+经验)；3)把分析结果翻译成业务听得懂的建议(storytelling)。会用AI的分析师效率3倍，但不会问对问题的直接被替代。"},
    {q:"SQL学到什么程度才能找工作？",a:"至少：1)基础查询滚瓜烂熟(SELECT/WHERE/JOIN/GROUP BY)；2)窗口函数必须掌握(ROW_NUMBER/RANK/LAG/LEAD——面试最爱考)；3)子查询和CTE能写结构清晰的多层查询。刷题：LeetCode SQL中等难度全部通过+牛客SQL实战全部完成。全职2-3周，在职1-2个月。"},
    {q:"DA vs DS vs DE怎么选？",a:"<b>DA</b>=回答发生了什么、为什么(SQL+BI，门槛最低)；<b>DS</b>=回答将会发生什么(Python+统计+ML，需数理基础)；<b>DE</b>=搭建数据基础设施(Spark/Airflow，偏软件工程)。建议：大多数人从DA切入(门槛低+岗位多)，1-2年后根据兴趣往DS或DE深入。"}

  accountant: [
    {q:"不做审计不进事务所，会计还有高薪出路吗？",a:"<b>当然有。</b>高薪方向：1)<b>财务BP</b>——深入业务做经营分析+预算管控，互联网大厂15-30K；2)<b>税务筹划</b>——资深税务专家年薪50-100W+；3)<b>IPO/资本市场财务</b>——辅助上市全流程，单项目奖金6-12个月工资；4)<b>FP&A</b>——外企标配管理会计方向。关键转型思维：从做账的变成用数据帮业务做决策的。"},
    {q:"CPA值不值得花2-3年考？",a:"<b>值得但看职业目标。</b>进事务所→CPA必须；进大厂财务→CPA强烈推荐(简历筛选巨大加分)；进银行/国企→CPA是职称晋升硬通货；创业/小企业→性价比不高。在职备考确实需2-3年非常辛苦——但获得的是终身有效、全行业认可的能力身份证。暂不想投入2-3年可先考中级会计职称(3-6个月)。"},
    {q:"会计专业出路太窄，感觉只会做账？",a:"<b>会计核心能力(数据敏感+逻辑严谨+合规意识)其实是很多高薪岗位的底层能力。</b>可走方向：财务分析/FP&A、投资分析/行业研究(读懂财报是投资基本功)、风控/内审/合规、四大财务咨询、董秘/投资者关系。别把会计当限制而当底座——叠加数据分析/商业理解/行业知识，竞争力远超纯商科或纯技术背景。"}

  project_manager: [
    {q:"PMP证书真的有用吗？",a:"<b>有用但非魔法。</b>PMP价值：1)简历筛选关——很多大公司PM岗明确PMP优先；2)系统性框架——教你怎么职业地管项目，对转行/新人尤其有价值；3)薪资提升——持证者比非持证者平均高16%(全球，中国约10-15%)。但是：有经验+PMP=如虎添翼，没经验+PMP=纸上谈兵。建议先积累1-2年经验再考，这期间可先考CAPM(无经验要求)。"},
    {q:"项目经理和产品经理有什么区别？",a:"<b>产品经理回答做什么、为什么做</b>(定义方向，享受不确定性)；<b>项目经理回答怎么做、什么时候做完</b>(组织资源，享受把混乱变有序)。选产品如果你享受探索和创意、对用户心理好奇；选项目如果你享受协调资源、对按时按质交付有执念。注意：互联网公司PM默认指产品经理，传统行业(建筑/制造/医药)PM通常指项目经理。"},
    {q:"技术不好能做项目经理吗？",a:"<b>取决于你管什么类型的项目。</b>软件开发→需技术理解力(看懂方案、理解估算逻辑)，不需自己写代码；建筑/工程→需懂图纸和施工流程；市场/活动→几乎不需技术背景，更需创意+统筹+商务能力。PM不需成为技术专家但需成为最好的翻译官——把业务需求翻译给技术团队，把技术限制翻译给业务方。"}

  operations: [
    {q:"运营是不是什么人都能做？如何不被替代？",a:"<b>入门门槛低但做好的门槛非常高。</b>执行型运营(发推送/回评论/拉群)最易被替代；策略型运营(数据驱动增长/用户体系设计/商业变现)越做越值钱。升级方法：1)必须学SQL和数据分析；2)建立ROI思维——每件事能回答花了多少资源、带来什么效果；3)选择行业深耕。脉脉高频：3年还在做执行型运营？要么转型策略方向，要么接受天花板。"},
    {q:"运营转产品经理可行吗？",a:"<b>非常可行——运营→产品是互联网最经典转型路径之一。</b>运营转PM优势：比纯PM更懂用户(天天打交道)、更懂执行(知道策略落地的运营动作)、更有数据sense。需补充：产品设计思维(PRD/原型)、技术理解力、优先级判断力(PM最大挑战是说不做什么)。建议：不要辞职——在现在岗位上主动承担产品化工作，用项目经验而非title证明产品能力。"},
    {q:"用户/商家/策略/内容运营怎么选？",a:"<b>用户运营</b>——需求最大入门最易但竞争激烈；<b>商家/供给运营</b>——平台型公司需求旺盛需BD+数据能力；<b>策略运营</b>——薪资最高天花板最高但需强数据+商业判断力；<b>内容运营</b>——适合创意和表达的人；<b>增长运营</b>——最接近增长黑客，效果导向薪资高。前2年可轮岗感受，第3年必须选定方向深度积累。"}
  ],
  c_pm:[
    {q:"C端PM和B端PM选哪个？",a:"<b>C端(消费者)</b>——面向海量用户，数据驱动+用户心理+快速实验，适合喜欢用户研究+数据的人；<b>B端(企业)</b>——面向企业客户，业务理解+系统设计+长周期交付，适合喜欢抽象建模+商业逻辑的人。薪资：B端中后期天花板更高( SaaS股票期权)，C端早期涨幅更快。建议：先选你喜欢面对的\"用户\"——是普通消费者还是企业客户？"},
    {q:"没有技术背景能做C端PM吗？",a:"<b>可以，而且很多顶级PM不是技术出身。</b>C端PM的核心是用户洞察和问题定义，而非技术实现。你需要的是：1)能和工程师有效沟通的技术理解力(不是写代码)；2)数据分析能力( SQL+AB测试)；3)强大的用户同理心。张一鸣说过：\"产品经理最重要的能力是对用户的了解\"——这和技术背景无关。"},
    {q:"C端PM的35岁危机怎么办？",a:"<b>执行型PM确实面临年轻化竞争，但策略型/商业型PM越老越值钱。</b>关键分水岭：从\"接需求写PRD\"升级到\"定义产品方向+对商业结果负责\"。建议：第3年开始主动参与产品战略和商业决策，积累\"为什么做\"而非仅\"怎么做\"的经验。最稀缺的PM是\"懂用户+懂数据+懂商业\"的三角型人才。"}
  ],
  b_pm:[
    {q:"B端PM和C端PM的核心区别？",a:"<b>决策逻辑不同：</b>C端靠数据+直觉(海量用户AB测试)，B端靠业务理解+客户沟通(一个客户可能占30%收入)；<b>产品节奏不同：</b>C端快速迭代(周级)，B端谨慎交付(月级/季度)；<b>核心能力不同：</b>C端偏用户心理+数据分析，B端偏业务抽象+系统设计。选择建议：如果你享受\"把一个复杂混乱的业务流程梳理成清晰系统\"，选B端；如果你享受\"洞察海量用户的微妙心理\"，选C端。"},
    {q:"B端PM需要懂技术吗？",a:"<b>比C端更需要。</b>B端产品往往涉及API集成、权限系统、数据迁移等技术场景。你不需要会写代码，但需要：1)理解API的基本概念(RESTful/Webhook/数据同步)；2)能和CTO/架构师做有效技术对话；3)理解SaaS多租户架构的基础。建议花2-4周学习基础技术概念——不需要深度，但需要广度。"},
  ],
  backend_dev:[
    {q:"Java/Go/Python选哪个语言入门？",a:"<b>Java</b>——国内企业级市场占有率最高(大厂+银行+传统企业)，岗位最多但学习曲线较陡；<b>Go</b>——云原生/微服务时代首选，简洁高效，字节/腾讯/哔哩哔哩大量使用，未来增长最快；<b>Python</b>——AI/数据方向首选，语法最简单适合快速入门。建议：想进大厂选Java或Go；想快速入门+AI方向选Python；最终三个都要了解，但先精通一个。"},
    {q:"AI编程工具( Copilot/ Cursor )会替代初级后端吗？",a:"<b>不会替代，但会大幅提高效率门槛。</b>AI工具让写代码快了3-5倍，这意味着：1)初级岗的\"纯执行\"价值在降低——你需要更快地成长到能做系统设计的水平；2)AI让有经验的人效率更高，拉大了初级和高级之间的产出差距。建议：不要恐惧AI，把它当作效率工具——学会用AI辅助写代码、Debug、写文档，这本身就是一项竞争力。"},
  ],
  frontend_dev:[{q:"前端会被AI替代吗？",a:"<b>纯页面开发在被AI加速替代，但前端工程化、性能优化、交互设计的价值在上升。</b>AI能生成登录页面，但无法设计复杂后台的前端架构。建议：把AI当效率工具，花时间在理解浏览器原理、性能优化、前端工程化上；关注前端+AI交叉方向( AI交互/WebAssembly/可视化)。"}],
  tech_sales:[{q:"售前和纯销售的区别是什么？",a:"<b>纯销售=签单导向(商务+谈判)，售前=方案导向(技术+咨询)。</b>售前需要：理解产品技术架构、设计客户方案、做技术演示。薪资：纯销售提成占比更高(波动大)，售前底薪更高(更稳定)。应届生建议：有技术背景优先选售前(职业出口更广)，纯商科可从销售助理切入。"},{q:"没技术背景怎么入行科技销售？",a:"<b>两条路：</b>A)花2-3个月考基础技术认证(AWS Cloud Practitioner)→投SaaS公司SDR→边做边学；B)卖\"商业解决方案\"而非\"技术产品\"(如CRM/HR系统/Marketing SaaS)，这类产品购买决策者是业务负责人而非CTO。"}],
  hr_od:[{q:"做HR真的有前途吗？",a:"<b>事务型HR(发工资/办入职)确实容易被替代，但战略型HR(组织设计/人才战略/文化塑造)是CEO最关心的事。</b>字节/阿里/腾讯HRBP薪资30-60K+。建议：入行2年内从\"人事执行\"转到\"业务伙伴\"——主动参与业务会议、学习看业务数据、用HR工具帮业务解决问题。"},{q:"HR要不要考证？",a:"<b>值得考：</b>企业人力资源管理师(人社部认证，国企/大厂常见要求)、SHRM-CP(外企认可)、MBTI/DiSC施测师(OD/TD方向实用)。<b>不建议：</b>野鸡机构\"HR总监班\"。猎头原话：除非是SHRM或企业人力一级，否则我不看证书栏。"}],
  bio_medical:[{q:"非医药背景能进医药行业吗？",a:"<b>能，入口因岗位而异。</b>产品专员→偏好医药背景但不绝对；市场/品牌→对专业要求宽松；商务/准入→看重政策理解+沟通；医药代表→专业门槛最低。但所有方向共同要求：必须系统性学习一个疾病领域——不懂疾病不可能做好医药产品。"},{q:"医药行业未来最大的机会在哪？",a:"<b>三大增量方向：</b>1)创新药出海(百济/信达等国际化，急需懂海外注册+国际市场的人才)；2)CXO(CRO/CDMO持续扩张，临床试验方向需求旺盛)；3)数字健康/AI制药(融合IT+医药的复合背景最稀缺)。建议：选一个疾病领域(肿瘤/自免/代谢)深度积累，跨领域通才不如一个领域专才。"}],
  finance_analyst:[{q:"卖方研究员和买方研究员怎么选？",a:"<b>卖方(券商)=服务+写报告+路演</b>，入行门槛相对低，培训完善，但工作强度极大；<b>买方(基金)=做判断+管钱+对业绩负责</b>，薪资更高更纯粹，但门槛极高(通常需卖方2-3年+CFA)。经典路径：卖方2-4年→跳买方。100个卖方里约10-15个能成功。"},{q:"CFA和CPA考哪个？",a:"<b>想做投资/研究/基金→CFA；想做投行/财务分析/风控→CPA；想做复合方向→两个都考(先CPA打财务功底再CFA深化框架)。</b>双证全拿下需4-5年在职，非常辛苦，但对顶级金融岗位是简历核武器。"}],
  game_designer:[{q:"游戏策划需要会编程吗？",a:"<b>不需要写代码，但需要技术理解力。</b>你需理解引擎能力边界(不设计\"技术上无法实现\"的玩法)、能和程序员有效沟通(策划文档+流程图+数值表)。最低要求：用Unity/Unreal做一个可玩Demo——这个过程让你切身体会\"游戏怎么做出来的\"。"},{q:"去大厂还是独立游戏团队？",a:"<b>大厂=资源充足、培训完善、薪资竞争力强，但做流水线模块；独立团队=什么都要做(成长快)、创意自由度大但收入不稳定。</b>建议：刚入行先去大厂2-3年学正规军标准，再带经验去独立团队。"}],
  crossborder_ecom:[{q:"跨境电商现在还赚钱吗？",a:"<b>粗放暴利时代过去了，但品牌化+差异化+多渠道的玩家仍在高速增长。</b>新机会：1)TikTok Shop/Temu新平台(流量便宜)；2)特定品类深度差异化(户外/宠物/母婴细分)；3)\"中国供应链+海外内容能力\"组合。一位年销千万的卖家：以前拼谁先发现好产品，现在拼谁能让消费者觉得\"这个品牌懂我\"。"},{q:"英语不好能做跨境吗？",a:"<b>不需要\"很好\"，但需要\"能用\"。</b>ChatGPT/DeepL辅助写Listing和文案(效率极高)、模板库+翻译工具处理客服邮件(CET-4完全够用)。牛客上一位四级飘过的跨境运营：ChatGPT是我的英语外挂，客户从没发现我不是native speaker。"}],
  consultant:[{q:"非target school能进咨询吗？",a:"<b>MBB确实卡学校，但Tier2/精品咨询没那么绝对。</b>破局策略：1)从四大咨询/精品咨询切入→1-2年后申MBB社招(社招对学校比校招宽松)；2)在特定行业(医疗/汽车/能源)建立深度认知——咨询公司需要行业专家而非仅聪明通才；3)参加商赛+Case Competition；4)Networking——内部推荐可绕过简历筛选。"},{q:"咨询的工作强度到底多大？",a:"<b>比其他行业累。</b>周工时约55-70h(MBB)，周一飞客户城市、周四晚飞回、周五内部工作。四大咨询稍轻松(50-60h)。适合你如果喜欢高强度+高成长+高频出差且身体能承受；不适合如果你看重工作生活平衡。但大多数人只待2-4年——不是一生的选择。"}],
  brand_marketing:[{q:"品牌营销和效果营销怎么选？",a:"<b>品牌=长期资产建设(品牌定位/故事/体验)，适合有创意/审美/战略思维的人；效果=短期可量化获客(广告投放/SEO/转化优化)，适合数据驱动/喜欢快速反馈的人。</b>新人最好两个都接触1-2年再深耕。最值钱的营销人是\"懂品牌的增长负责人\"或\"懂数据的品牌总监\"。"},{q:"快消管培生值得去吗？",a:"<b>值得，宝洁/联合利华/玛氏管培被称为营销界黄埔军校。</b>方法论体系完整、轮岗机制成熟、职业出口广阔(3-5年后被互联网/奢侈品/新消费挖走)。但薪资增速不如互联网，方法论沉淀远胜。宝洁校友经典评价：快消3年=互联网1.5年薪资，但快消3年的方法论可用30年。"}],
  psychologist:[{q:"心理咨询师前期投入那么大，真能回本吗？",a:"<b>能回本但周期比你想象的长。</b>新手(前2年)：投入5-10万，月入3-8K——最难熬；成熟(3-5年)：月入15-25K；资深(5年+)：月入30K+，独立执业自由度高。关键：前2年需其他收入支撑，这也是为什么很多人从其他行业转型(带积蓄入行)。知乎咨询师：这不是快速暴富的职业，但真热爱的话，5年后你会感谢坚持的自己。"},{q:"AI会替代心理咨询师吗？",a:"<b>AI能替代标准化服务(测评/CBT自助)，但无法替代深度治疗性关系。</b>心理咨询起效的核心是治疗联盟——来访者和咨询师之间安全、信任、真实的关系。这不是技术问题是人性问题。反而AI会淘汰\"照手册念\"的低水平从业者——这是好事。"}],
  new_energy_ve:[{q:"新能源车行业现在还值得入行吗？",a:"<b>从爆发期进入淘汰赛期——不是饱和而是洗牌。</b>头部企业(比亚迪/蔚小理/小米/华为)还在扩招，腰部企业收缩。建议：1)投头部\"增长型\"业务线(智能驾驶/出海/能源服务)；2)关注产业链上下游(电池/充电/芯片)可能比整车更稳；3)做好3年内格局大变的心理准备。"},{q:"非汽车/机械背景怎么进入？",a:"<b>新能源车比传统车企更需要跨界人才。</b>非技术可切入：产品经理(座舱体验/APP/充电)、用户运营/社群、品牌/市场、项目管理(PMP+行业学习)。花2-4周系统学行业基础(三电/智能驾驶分级/主要玩家)，然后找\"汽车+你已有能力\"的交叉点。"}],
  semiconductor:[{q:"非微电子/EE专业能进半导体吗？",a:"<b>能，入口比科班窄但存在。</b>非技术岗：应用工程师(FAE，偏技术+客户沟通)、产品工程师/PM(偏产品定义+项目管理)、销售/客户经理(需懂产品不需设计)、供应链/采购。完全非理工可从商务/运营方向切入。所有方向共同要求：学半导体产业链基础——芯片怎么从沙子变产品。"},{q:"选外企还是国内半导体企业？",a:"<b>外企(Intel/NVIDIA/TI)=体系完善、培训成熟、天花板明显(核心研发很少放中国)；国内企业=成长空间大、有机会做更有挑战的事、股权激励上限高，但体系不成熟。知乎经典建议：先外企学方法，再国内拼事业。</b>不同细分差距不同——芯片设计已接近国际先进、制造落后2-3代、设备/材料差距最大但国产替代最迫切。"}],
  growth_pm:[{q:"增长PM和普通PM的区别？",a:"<b>增长PM=指标驱动+实验文化+快速迭代。</b>普通PM回答\"用户需要什么\"，增长PM回答\"如何让更多用户发现/使用/留下来\"。核心差异：增长PM每天都在看数据、跑实验、优化漏斗。适合你如果：喜欢数据超过直觉、享受高频失败中找赢家、对\"转化率\"这个词有生理反应。"},{q:"没有产品经验能做增长PM吗？",a:"<b>可以从增长运营/数据分析岗切入，1-2年后转型增长PM。</b>增长PM核心能力=数据分析+实验设计+用户心理——这三样都可以在运营/分析岗中培养。简历加分项：自己做过一个增长实验(哪怕是公众号涨粉/社群拉新)，用数据展示\"实验前→实验后\"的变化。"}],
  qa_engineer:[{q:"测试会被AI和自动化替代吗？",a:"<b>纯手工执行测试正在被替代，但测试架构设计和质量体系建设反而更值钱。</b>AI可以自动生成测试用例、执行回归测试，但无法替代：1)理解业务逻辑设计测试策略；2)搭建自动化测试框架；3)推动团队质量文化。建议：尽早学自动化测试+CI/CD，从\"执行测试\"转型为\"设计质量体系\"。"}],
  devops_sre:[{q:"DevOps/SRE的门槛到底多高？",a:"<b>比前端/后端高——需要更全面的技术栈。</b>你需要：Linux系统管理(Docker/K8s)、至少一门脚本语言、CI/CD工具链、监控告警体系、基础网络知识。建议路径：先从运维/后端做起→在工作中积累线上故障处理经验→考AWS/阿里云认证→转DevOps/SRE。纯新手直接冲SRE难度大——建议先做1-2年后端开发打基础。"}],
  tpm:[{q:"TPM和普通PM有什么区别？",a:"<b>TPM=技术项目经理，负责\"怎么把项目按时高质量交付\"；普通PM=产品经理，负责\"做什么产品、为什么做\"。</b>TPM更偏执行和流程，需要技术理解力+项目管理能力+跨团队协调能力。适合你如果：享受把混乱的研发流程梳理清晰、对按时交付有执念、喜欢和技术团队一起工作。"}],

function renderJobQA(job) {
  var qa = JOB_QADATA[job.id];
  if (!qa || !qa.length) return '';
  var h = '<div style="margin-top:12px;border-top:1px solid var(--color-border);padding-top:12px;"><div class="dd-section-title">💬 ' + job.name + ' · 社区热议（点击问题查看回答）</div>';
  qa.forEach(function(item, i) {
    var qid = 'q_' + job.id + '_' + i;
    h += '<div style="font-size:0.82rem;margin-top:6px;border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;">' +
      '<div style="padding:10px 14px;cursor:pointer;background:var(--color-bg-alt);font-weight:600;color:var(--color-text);display:flex;align-items:center;gap:8px;user-select:none;" ' +
      'onclick="event.stopPropagation();var a=document.getElementById(\'' + qid + '\');var arrow=this.querySelector(\'.qa-arrow\');if(a.classList.toggle(\'hidden\')){arrow.textContent=\'▶\';this.style.background=\'var(--color-bg-alt)\'}else{arrow.textContent=\'▼\';this.style.background=\'var(--color-primary-light)\'}">' +
      '<span class="qa-arrow" style="font-size:0.7rem;flex-shrink:0;">▶</span> ' + item.q + '</div>' +
      '<div id="' + qid + '" class="hidden" style="padding:12px 14px;color:var(--color-text-secondary);font-size:0.82rem;line-height:1.75;background:var(--color-card);border-top:1px solid var(--color-border);">' + item.a + '</div>' +
      '</div>';
  });
  h += '<p style="font-size:0.7rem;color:var(--color-text-muted);margin-top:8px;">📌 以上问答整理自脉脉、知乎、小红书、牛客网等平台从业者真实讨论</p></div>';
  return h;
}

function renderPersonaCard(job) {
  var pd = (JOB_PERSONA[job.id] || {}).persona;
  if (!pd) return '';
  var fc = profile.flashCard || {};
  var userAbilities = (fc.abilities || []).join('、');
  var userStyle = fc.workStyle || '';

  // Calculate rough match score based on heuristic
  var matchScore = 0;
  var matchNotes = [];
  if (userAbilities && pd.strengths) {
    var strengthLower = pd.strengths;
    if (/共情|沟通|人际/.test(userAbilities) && /共情|沟通|信任|人际/.test(strengthLower)) { matchScore += 25; matchNotes.push('你的共情沟通能力与该岗位高度匹配'); }
    if (/逻辑|分析|数据|推理/.test(userAbilities) && /逻辑|分析|数据/.test(strengthLower)) { matchScore += 25; matchNotes.push('你的分析思维是该岗位的核心需求'); }
    if (/创造|创新|创意|设计/.test(userAbilities) && /创造|创新|设计|创意/.test(strengthLower)) { matchScore += 20; matchNotes.push('你的创造力与该岗位的创新需求契合'); }
    if (/组织|协调|统筹|管理/.test(userAbilities) && /组织|协调|统筹/.test(strengthLower)) { matchScore += 20; matchNotes.push('你的组织协调能力匹配该岗位'); }
  }
  matchScore = Math.min(matchScore + 30, 95); // base match

function simplifyWorkContent(job) {

  };

  return job.workContent.map(function(w){ return w.replace(/[，、].*/,'').substring(0,25)+'...'; }).slice(0,3);

function simplifySkillGap(job) {
  var s = job.skillGap;
  s = s.replace(/路径：.*/, '').replace(/建议路径：.*/, '').replace(/需掌握|需要补充|需了解|需系统学习/g, '需要学：');
  if (s.length > 80) s = s.substring(0,80) + '...';
  return s || '从零开始学，花几个月时间认真准备就行';
}

function simplifyCities(job) {
  return job.cities.split('|').map(function(c){ return c.split('（')[0].trim(); }).slice(0,3).join('、');
}

function simplifySalary(job) {
  var s = job.salary;
  var m = s.match(/应届(\d+-\d+[Kk])/);
  return m ? '毕业起薪约 ' + m[1] + '/月' : (s.substring(0,30) + '...');
}

function simplifyFit(job, topAbility, yourStyle) {
  var matches = [];
  var userAbs = (profile.flashCard?.abilities || []).join(' ');
  job.matchAbilities.forEach(function(a){
    if (userAbs.indexOf(a) >= 0 || userAbs.indexOf(a.substring(0,2)) >= 0) matches.push(a);
  });
  if (matches.length >= 2) return '✅ 很适合你！你的' + matches.slice(0,2).join('、') + '正好是这个岗位需要的';
  if (matches.length >= 1) return '👍 还不错！你的' + matches[0] + '能用上，再补一点行业知识就行';
  return '🤔 需要努把力——你的底层能力（' + yourStyle + '）可以迁移过来，但需要学一些新知识';
}

  html += '<div class="card mt-16"><h3>🗺️ 奥德赛计划 · 三条可选人生路径</h3><p class="text-secondary mt-8 mb-16">基于斯坦福大学《人生设计课》Odyssey Plan 方法论——没有哪条是"正确的"，它们只是不同的可能性，值得你同时探索。</p><div class="odyssey-grid">';

  for (var i = 0; i < odyssey.length; i++) {
    var p = odyssey[i];
    html += '<div class="odyssey-card ' + p.color + '"><div style="font-size:2.5rem;margin-bottom:8px;">' + p.icon + '</div><h4>' + p.title + '</h4><p style="font-size:0.82rem;color:var(--color-text-secondary);margin-bottom:8px;">' + p.desc + '</p><div style="font-size:0.78rem;text-align:left;line-height:1.6;"><div>📅 <strong>第1年：</strong>' + p.year1 + '</div><div style="margin-top:4px;">📅 <strong>第3年：</strong>' + p.year3 + '</div><div style="margin-top:4px;">📅 <strong>第5年：</strong>' + p.year5 + '</div></div><div style="margin-top:10px;padding:6px 12px;background:rgba(255,255,255,0.6);border-radius:20px;font-size:0.75rem;color:var(--color-text-secondary);">' + p.match + '</div></div>';
  }

  html += '</div><p class="text-secondary mt-12" style="font-size:0.78rem;text-align:center;">💡 奥德赛计划的核心：<strong>同时探索多条路径</strong>，用小成本的原型体验（而非空想）来判断哪条路最值得走。</p></div>';

  html += '<button class="btn btn-primary mt-16" onclick="restartApp()" style="display:block;margin:0 auto;">🔄 重新开始探索</button>';

  mainContent.innerHTML = html;
}

function buildOdysseyPlan() {
  var fc = profile.flashCard || {};
  var abilities = fc.abilities || [];
  var passions = fc.passions || [];
  var r = profile.ratioCustom || { want: 33, good: 34, money: 33 };
  var topJob = profile.recommendedJobs[0];
  var secondJob = profile.recommendedJobs[1];
  var jobName = topJob ? topJob.name : '目标岗位';
  var adjName = secondJob ? secondJob.name : '相邻领域';
  var passionStr = passions.length ? passions[0] : '你热爱的领域';

  // Adjacent role mapping
  var adjMap = {ai_product:'技术咨询','c_pm':'增长PM','b_pm':'管理咨询','data_analyst':'数据产品','ux_designer':'前端开发','content_creator':'品牌营销','accountant':'财务BP','operations':'产品经理','project_manager':'产品经理','backend_dev':'架构师','frontend_dev':'全栈开发','growth_pm':'C端PM','tech_sales':'客户成功'};
  var altRole = adjMap[topJob?topJob.id:''] || adjName;

  return [
    {icon:'🚀',title:'路径A · 顺势而为',color:'path-a',
      desc:'在「'+jobName+'」领域深耕，充分发挥已有优势，追求持续晋升与行业影响力。',
      year1:'入职「'+jobName+'」，快速学习行业规则与核心技能，完成从新手到能独立工作的转变',
      year3:'成为团队核心骨干，独立负责模块/项目，建立专业口碑，开始指导新人',
      year5:'晋升高级/Lead，开始带小团队或成为该领域公认的专家',
      match:'最适合你'+(r.good>=30?'优势变现':(r.want>=30?'热情驱动':'务实发展'))+'的倾向——在当前最擅长的方向做到极致'},
    {icon:'🌈',title:'路径B · 跨界融合',color:'path-b',
      desc:'先做「'+jobName+'」2-3年打基础，再将核心能力跨界迁移到「'+altRole+'」，创造独特的复合竞争力。',
      year1:'在主业之余，每周花5小时接触「'+altRole+'」的学习资源和社区',
      year3:'两个领域的交叉能力成型——你成为团队中唯一既懂'+jobName+'又懂'+altRole+'的人',
      year5:'凭借复合背景跳槽/晋升到需要双重能力的高薪岗位（市场稀缺性=薪资溢价）',
      match:'适合你'+(abilities.length>=3?'多元能力的组合优势':'持续探索的好奇心')+'——不满足于只在一个领域深耕'},
    {icon:'🌟',title:'路径C · 自主创造',color:'path-c',
      desc:'以「'+jobName+'」为主业保障收入，同时围绕「'+passionStr+'」建立个人IP/副业，追求自主与多元。',
      year1:'利用业余时间启动一个围绕「'+passionStr+'」的副业/自媒体/开源项目，积累第一批关注者',
      year3:'副业收入达到主业30-50%，验证了商业模式的可行性，获得\"两条腿走路\"的安全感',
      year5:'可选择：A)全职投入副业(已成熟)；B)保持双线模式(最大化抗风险能力)；C)将副业积累的能力反哺主业(升职加薪)',
      match:'适合你'+(r.want>=25?'对自由度和创造性的追求':'在稳定基础上探索更多可能')+'——不把所有鸡蛋放在一个篮子里'}
  ];
}

function showCityMap(jobId) {
  var clusterKey = CAREER_CLUSTER_MAP[jobId];
  if (!clusterKey) clusterKey = '互联网 / 信息技术';
  var cluster = CITY_CLUSTERS[clusterKey];
  if (!cluster) return;

  var overlay = document.getElementById('cityMapOverlay');
  document.getElementById('cityMapEmoji').textContent = '🗺️';
  document.getElementById('cityMapTitle').textContent = clusterKey + ' · 产业集群地图';
  document.getElementById('cityMapSubtitle').textContent = '颜色标记：🔴红色 = 已成熟的产业集群城市 | 🟠橙色 = 政策扶持的高潜力城市';

  var body = document.getElementById('cityMapBody');
  var html = '<div class="city-cluster-grid">';

  // Developed cities
  html += '<div class="city-cluster-section"><h4>🔴 成熟产业集群城市</h4>';
  (cluster.developed || []).forEach(function(c){
    html += '<div class="city-card dev"><div class="cc-name">' + c.city + '</div><div class="cc-area">📍 ' + c.area + '</div><div class="cc-note">' + c.note + '</div></div>';
  });
  html += '</div>';

  // Emerging cities
  html += '<div class="city-cluster-section"><h4>🟠 高潜力 / 政策扶持城市</h4>';
  (cluster.emerging || []).forEach(function(c){
    html += '<div class="city-card rising"><div class="cc-name">' + c.city + '</div><div class="cc-area">📍 ' + c.area + '</div><div class="cc-note">' + c.note + '</div></div>';
  });
  html += '</div></div>';

  // Policy reference
  if (cluster.policyRef) {
    html += '<div class="city-policy">📋 <strong>政策依据：</strong>' + cluster.policyRef + '</div>';
  }

  html += '<p class="text-secondary mt-12" style="font-size:0.72rem;text-align:center;">💡 数据来源：工信部/科技部/国家统计局/各省政府官网公开文件 + 招聘平台(猎聘/脉脉/牛客)产业集聚分析</p>';

  body.innerHTML = html;
  overlay.classList.add('show');
}

function closeCityMap(e) {
  if (e && e.target !== document.getElementById('cityMapOverlay')) return;
  document.getElementById('cityMapOverlay').classList.remove('show');
}

function closeCompareModal(e) {
  if (e && e.target !== document.getElementById('compareModalOverlay')) return;
  document.getElementById('compareModalOverlay').classList.remove('show');
}

// ============ LOCAL STORAGE SAVE / RESUME ============
function saveProgress() {
  try {
    var phaseLabels = {welcome:'欢迎页',phase1:'闪光挖掘第'+(state.questionIndex+1)+'题',phase1_flash:'闪光点卡',phase2:'行业探索',phase2_result:'三圈配方结果',phase3:'智能匹配',final:'奥德赛计划'};
    var data = {state:state,profile:profile,time:new Date().toLocaleString('zh-CN'),phaseLabel:phaseLabels[state.phase]||'探索中'};
    localStorage.setItem('lianlian_progress', JSON.stringify(data));
  } catch(e) {}
}
function checkSavedProgress() {
  try {
    var raw = localStorage.getItem('lianlian_progress');
    if (!raw) return null;
    var data = JSON.parse(raw);
    if (!data.state || data.state.phase === 'welcome' || data.state.phase === 'final') return null;
    return data;
  } catch(e) { return null; }
}
function resumeProgress() {
  try {
    var raw = localStorage.getItem('lianlian_progress');
    if (!raw) return;
    var data = JSON.parse(raw);
    Object.assign(state, data.state);
    Object.assign(profile, data.profile);
    profile.recommendedJobs = data.profile.recommendedJobs || [];
    render();
    window.scrollTo(0, 0);
  } catch(e) { restartApp(); }
}
function clearSavedProgress() {
  localStorage.removeItem('lianlian_progress');
  restartApp();
}

function restartApp() {
  state.phase = 'welcome';
  state.questionIndex = 0;
  state.phase2Step = 'fill';
  state.phase3Step = 'intro';
  state.coins = 0;

  // Reset profile
  profile.mbti_ei = ''; profile.mbti_sn = ''; profile.mbti_tf = ''; profile.mbti_jp = '';
  profile.hollandCode = []; profile.openness = ''; profile.coreValues = [];
  profile.dominantSkills = []; profile.workEnvPref = '';
  profile.major = ''; profile.workYears = ''; profile.currentCity = ''; profile.targetCity = '';
  profile.flashCard = null;
  profile.skillsSelfAssess = []; profile.softSkills = []; profile.problemSolving = '';
  profile.moneyDirections = [];
  profile.ratioPreset = ''; profile.ratioCustom = { want: 0, good: 0, money: 0 };
  profile.orgTypes = [];
  profile.careerMode = '';
  profile.recommendedJobs = [];
  profile.selectedIndustries = [];

  // Reset temp state
  state._multiTemp = [];
  state._tagTemp = [];
  state._dualTemp = { ie: null, tf: null };
  state._moneyTemp = [];

  render();
  window.scrollTo(0, 0);
}
